# Mosquitto MQTT Broker Configuration
# EV Charging Station Digital Twin — Laptop 2
#
# Usage:
#   mosquitto -c laptop-2/mosquitto/mosquitto.conf
#
# For a trusted LAN prototype: port 1883, password auth, ACL.
# For untrusted networks: uncomment the TLS section and use port 8883.

# ── Listener ──────────────────────────────────────────────────
# Bind to all interfaces so Laptop 1 can reach the broker over LAN.
# NEVER expose this to the public internet without TLS.
listener 1883 0.0.0.0

# ── Authentication ────────────────────────────────────────────
# Disallow anonymous connections — every client must authenticate.
allow_anonymous false

# Password file (hashed with mosquitto_passwd -H sha512)
password_file mosquitto/passwd

# Access Control List — restricts which user can pub/sub which topics.
acl_file mosquitto/acl

# ── Protocol ──────────────────────────────────────────────────
# MQTT v5 and v3.1.1 both accepted
protocol mqtt

# Maximum QoS allowed (1 = at-least-once, our standard)
max_qos 1

# Maximum payload size: 256 KB (more than enough for JSON messages)
message_size_limit 262144

# ── Persistence ───────────────────────────────────────────────
# Persist retained messages and QoS 1/2 in-flight messages across restarts
persistence true
persistence_location mosquitto/data/

# ── Logging ───────────────────────────────────────────────────
log_dest stderr
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── Connection limits ─────────────────────────────────────────
max_connections 20
max_keepalive 120

# ── TLS (uncomment for untrusted networks) ────────────────────
# listener 8883 0.0.0.0
# cafile mosquitto/certs/ca.crt
# certfile mosquitto/certs/server.crt
# keyfile mosquitto/certs/server.key
# require_certificate false
# tls_version tlsv1.2
